<!DOCTYPE html>
<html lang="id" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Alvian</title>

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between antialiased selection:bg-blue-600 selection:text-white">

    <!-- HEADER / NAVBAR -->
    <header class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80">
        <nav class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            
            <!-- Brand / Logo -->
            <a href="index.html" class="group flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-blue-500 group-hover:scale-125 transition-transform duration-300"></span>
                <span class="text-white font-bold :text-blue-400 transition-colors">
                    My Porto.
                </span>
            </a>

            <!-- Navigation Links -->
            <ul class="flex items-center gap-1 sm:gap-2">
                <li>
                    <a href="index.html" class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-900 transition">
                        Beranda
                    </a>
                </li>
                <li>
                    <a href="about.html" class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-900 transition">
                        Tentang
                    </a>
                </li>
                <li>
                    <a href="contact.html" class="px-3.5 py-1.5 rounded-lg text-sm font-semibold text-white bg-slate-800/80 border border-slate-700/60 shadow-sm transition">
                        Kontak
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-6xl mx-auto w-full flex-1 px-6 py-12 md:py-20 flex flex-col items-center justify-center space-y-8">
        
        <!-- SINGLE WHATSAPP CARD -->
        <div class="w-full max-w-md bg-gradient-to-br from-blue-950/40 via-slate-900 to-slate-900 border border-blue-800/50 rounded-2xl p-8 space-y-6 text-center shadow-2xl">
            
            <div class="w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-3xl mx-auto">
                <i class='bx bxl-whatsapp'></i>
            </div>
            
            <!-- BUTTON BUKA WHATSAPP SEKARANG -->
            <a href="https://wa.me/qr/FK7HAQFKMV4VC1" 
               target="_blank" rel="noopener noreferrer"
               class="inline-flex items-center justify-center gap-2.5 w-full py-4 px-6 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm sm:text-base shadow-lg shadow-emerald-600/25 active:scale-[0.98] transition-all duration-200">
                <i class='bx bxl-whatsapp text-2xl'></i>
                <span>Buka WhatsApp Sekarang</span>
            </a>
        </div>

    </main>

    <!-- FOOTER -->
    <header class="border-t border-slate-900 bg-slate-950">
        <footer class="max-w-6xl mx-auto px-6 py-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
            <p>© 2026 Alvian. All rights reserved.</p>
            <div class="flex items-center gap-6 font-medium">
                <span class="text-slate-400">Portfolio</span>
                <span class="w-1 h-1 rounded-full bg-slate-800"></span>
                <span class="text-slate-400">Jepara, Indonesia</span>
            </div>
        </footer>
    </header>

</body>

</html>
